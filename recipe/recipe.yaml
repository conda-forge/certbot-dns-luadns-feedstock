context:
  version: "5.9.0"

package:
  name: certbot-dns-luadns
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-luadns/certbot_dns_luadns-${{ version }}.tar.gz
  sha256: b7971999481e013663e625cd12250cfeb01b045c2ffd82f31110431c038dbd56

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dns-lexicon >=3.14.1

tests:
  - python:
      imports:
        - certbot_dns_luadns
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: LuaDNS DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
